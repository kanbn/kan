<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: 2rem;
        background: #fff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000;
          color: #fafafa;
        }
        button {
          background: #fff;
          color: #111;
        }
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.7;
      }
      button {
        padding: 0.625rem 1.25rem;
        border-radius: 9999px;
        cursor: pointer;
        border: 0;
        font-size: 0.9rem;
        font-weight: 500;
        background: #111;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Can't reach the server. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
